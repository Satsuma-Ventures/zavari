<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zavari — Phase 3 Concepts</title>
<!-- Fonts from Google Fonts CDN. Injected at runtime so the bundler keeps it
     a remote reference instead of inlining the woff2 files. -->
<script>
(function () {
  var l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap';
  document.head.appendChild(l);
})();
</script>
<!-- Token + component CSS only (no font @import, so nothing gets inlined as base64) -->
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="../tokens/components.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--color-bg); color: var(--color-ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  #root { min-height: 100vh; }
  ::selection { background: rgba(0,153,255,0.18); }
  button { font-family: inherit; }
  /* calm, unhurried entrance for screen content */
  @media (prefers-reduced-motion: no-preference) {
    main > *:first-child { animation: zvIn 300ms cubic-bezier(0.2,0,0,1) both; }
    @keyframes zvIn { from { transform: translateY(7px); } to { transform: none; } }
  }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: rgba(10,31,68,0.18); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(10,31,68,0.3); background-clip: content-box; }
</style>
</head>
<body>
<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#0A1F44"/>
  <g stroke="#00D4FF" stroke-width="1.6" fill="none" stroke-linecap="round">
    <line x1="30" y1="38" x2="68" y2="50"/>
    <line x1="30" y1="50" x2="68" y2="50"/>
    <line x1="30" y1="62" x2="68" y2="50"/>
  </g>
  <circle cx="30" cy="38" r="3" fill="#0099FF"/>
  <circle cx="30" cy="50" r="3" fill="#0099FF"/>
  <circle cx="30" cy="62" r="3" fill="#0099FF"/>
  <circle cx="68" cy="50" r="4.5" fill="#00D4FF"/>
</svg>
</template>
<div id="root"></div>

<!-- React + design-system bundle (bundle reads global React) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Data → kit → screens → shell (shell renders last) -->
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="kit.jsx"></script>
<script type="text/babel" src="act1.jsx"></script>
<script type="text/babel" src="act2.jsx"></script>
<script type="text/babel" src="act3.jsx"></script>
<script type="text/babel" src="act4.jsx"></script>
<script type="text/babel" src="act5.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
</body>
</html>
